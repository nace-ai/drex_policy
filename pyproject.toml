[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drex-policy"
version = "0.1.0"
description = "Guardrails validator that checks text, or text with images, against a Drex noul or score question."
authors = [{ name = "Nace.AI", email = "alish@nace.ai" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "guardrails-ai>=0.4.0",
    "nace-sdk>=0.6.2",
]

[project.optional-dependencies]
dev = ["pyright", "pytest", "ruff"]

[tool.setuptools]
packages = ["drex_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["drex_policy"]
