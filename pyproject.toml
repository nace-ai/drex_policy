[project]
name = "drex_policy"
version = "0.1.0"
description = "Guardrails validator that checks text, or text with images, against a Drex noul or score question."
authors = [
    {name = "Nace.AI", email = "alish@nace.ai"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "guardrails-ai>=0.4.0",
    "nace-sdk>=0.4.0"
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "ruff"
] 

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rP"
testpaths = [
    "tests"
]

[tool.pyright]
include = ["validator"]